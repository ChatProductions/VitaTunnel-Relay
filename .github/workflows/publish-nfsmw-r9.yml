name: Publish NFSMW r9 RPC rejection diagnostic VPK

on:
  push:
    branches: [main]
    paths:
      - tools/patch_nfsmw_r9_rpc_trace.py
      - .github/workflows/publish-nfsmw-r9.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nfsmw-aot-r9-publish
  cancel-in-progress: false

jobs:
  patch-and-mirror:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install deterministic DEFLATE optimizer
        run: python3 -m pip install --disable-pip-version-check --no-deps zopfli==0.4.3
      - name: Generate and verify r9 fault telemetry VPK
        run: |
          set -euo pipefail
          python3 tools/patch_nfsmw_r9_rpc_trace.py \
            tunnel/packages/NFSMW08_AOT_RPC_CALL_20261029.vpk \
            tunnel/packages/NFSMW09_AOT_RPCTRACE_20261029.vpk \
            --manifest tunnel/manifest.txt
          sha256sum tunnel/packages/NFSMW09_AOT_RPCTRACE_20261029.vpk
      - name: Publish validated package and manifest atomically
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f tunnel/packages/NFSMW09_AOT_RPCTRACE_20261029.vpk
          git add tunnel/manifest.txt
          if git diff --staged --quiet; then exit 0; fi
          git commit -m "Publish NFSMW r9 RPC rejection field telemetry"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
          done
          exit 1
