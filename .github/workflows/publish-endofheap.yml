name: Publish NFSMW AOT EndOfHeap hotfix for VitaTunnel
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'relay/endofheap-request.txt'
permissions:
  contents: write
concurrency:
  group: nfsmw-aot-endofheap-bridge-publish
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout relay
        uses: actions/checkout@v4
      - name: Download exact verified earlier native AOT VPK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download game-nfsmw-aot-20261028-osd \
            --repo "$GITHUB_REPOSITORY" \
            --pattern NFSMW05_AOT_Vita_Test_20261028_SyscallOSD.vpk \
            --dir /tmp --clobber
      - name: Patch native syscall and check exact VPK hash
        run: |
          python3 tools/patch_nfsmw_aot_endofheap.py \
            /tmp/NFSMW05_AOT_Vita_Test_20261028_SyscallOSD.vpk \
            /tmp/NFSMW05_AOT_EndOfHeap_HOTFIX.vpk
          printf '%s  %s\n' \
            ddddf0097490b42ad24e2b044a9c6473d714be622d433ab22d09fba8606e6538 \
            /tmp/NFSMW05_AOT_EndOfHeap_HOTFIX.vpk | sha256sum --check
      - name: Stage new VPK with its matching bridge manifest
        run: |
          mkdir -p tunnel/packages
          cp /tmp/NFSMW05_AOT_EndOfHeap_HOTFIX.vpk tunnel/packages/
          cat > tunnel/manifest.txt <<'EOF'
          version=game-nfsmw-aot-20261028-endofheap-hotfix
          title_id=NFMRA0001
          vpk_url=https://raw.githubusercontent.com/ChatProductions/VitaTunnel-Relay/main/tunnel/packages/NFSMW05_AOT_EndOfHeap_HOTFIX.vpk
          sha256=ddddf0097490b42ad24e2b044a9c6473d714be622d433ab22d09fba8606e6538
          EOF
      - name: Publish verified AOT VPK release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view game-nfsmw-aot-20261028-endofheap-hotfix --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload game-nfsmw-aot-20261028-endofheap-hotfix /tmp/NFSMW05_AOT_EndOfHeap_HOTFIX.vpk \
              --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create game-nfsmw-aot-20261028-endofheap-hotfix \
              /tmp/NFSMW05_AOT_EndOfHeap_HOTFIX.vpk \
              --repo "$GITHUB_REPOSITORY" \
              --title "NFSMW 2005 AOT EndOfHeap syscall hotfix" \
              --notes "Experimental native AOT test, not a playable game. Adds a bounded ARM Thumb-2 hotfix for EE EndOfHeap syscall 0x3E. Original boot.elf and game assets are not included. Requires existing ux0:data/ps2vita/boot.elf."
          fi
      - name: Commit VPK and manifest together for VitaTunnel v0.3.4
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f tunnel/packages/NFSMW05_AOT_EndOfHeap_HOTFIX.vpk
          git add tunnel/manifest.txt
          if ! git diff --cached --quiet; then
            git commit -m "Serve improved NFSMW AOT EndOfHeap build via VitaTunnel"
            git push
          fi
