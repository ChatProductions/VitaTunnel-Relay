name: Build VitaTunnel VPK
on:
  workflow_dispatch:
  push:
    paths:
      - 'src/**'
      - 'CMakeLists.txt'
      - 'tools/**'
      - 'assets/**'
      - '.github/workflows/build.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    container: vitasdk/vitasdk:2026.08
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install VitaSDK packages
        run: |
          vdpm install libvita2d libzip curl zlib zstd xz bzip2 libpng libjpeg-turbo freetype
      - name: Install pinned installer module
        run: bash tools/prepare_vendor.sh
      - name: Bundle host CA certificate store
        run: |
          if [ -f /etc/ssl/certs/ca-certificates.crt ]; then
            cp /etc/ssl/certs/ca-certificates.crt assets/cacert.pem
          else
            echo 'Missing CA certificate store' >&2
            exit 1
          fi
      - name: Validate AOT relay configuration
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from configparser import ConfigParser
          cp=ConfigParser()
          cp.read_string('[relay]\n'+Path('assets/config.ini').read_text())
          cfg=cp['relay']
          assert cfg['owner']=='ChatProductions'
          assert cfg['repo']=='VitaTunnel-Relay'
          assert cfg['title_id']==Path('relay/target_id.txt').read_text().strip()=='NFMRA0001'
          assert cfg['log_dir']=='ux0:data/ps2vita'
          assert cfg.getboolean('upload_logs') is False
          assert cfg['token']==''
          PY
      - name: Configure and compile
        run: |
          export VITASDK="${VITASDK:-/usr/local/vitasdk}"
          cmake -S . -B build -DCMAKE_TOOLCHAIN_FILE="$VITASDK/share/vita.toolchain.cmake" -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel 2
      - name: Upload VPK
        uses: actions/upload-artifact@v4
        with:
          name: VitaTunnel-v0.3.4-VPK
          path: build/VitaTunnel.vpk
